<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .border-ring { fill: none; stroke: #184e36; stroke-width: 12; }
      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 58px; fill: #184e36; }
      .brand-script { font-family: 'Great Vibes', 'Brush Script MT', cursive, serif; font-size: 82px; fill: #184e36; }
      .tagline-text { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 5px; fill: #184e36; }
      .icon-fill { fill: #184e36; }
      .icon-stroke { stroke: #184e36; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="236" class="border-ring" />

  <!-- Hanger Hook & Frame -->
  <path d="M 250 100 C 265 80, 250 60, 240 70 C 230 80, 245 105, 250 115" class="icon-stroke" stroke-width="7" />
  <path d="M 250 115 L 160 170 C 150 176, 150 190, 160 195 L 340 195 C 350 190, 350 176, 340 170 Z" class="icon-stroke" stroke-width="7" />

  <!-- T-Shirt Graphic -->
  <path d="M 180 195 L 155 230 L 180 245 L 180 320 Q 250 330 320 320 L 320 245 L 345 230 L 320 195 Z" class="icon-fill" opacity="0.9" />

  <!-- Leaves Graphic inside T-Shirt -->
  <path d="M 230 310 Q 210 260 250 240 Q 290 260 270 310 Z" fill="#ffffff" />
  <path d="M 210 300 Q 185 265 225 255 Q 240 280 210 300 Z" fill="#ffffff" />
  <path d="M 250 240 Q 250 280 250 315" stroke="#184e36" stroke-width="4" />

  <!-- WearVerse Typography -->
  <g transform="translate(0, 390)">
    <text x="250" y="0" text-anchor="middle" class="brand-title">
      Wear<tspan font-family="Georgia, serif" font-style="italic" fill="#184e36">Verse</tspan>
    </text>
  </g>

  <!-- Decorative Leaves Divider -->
  <path d="M 240 412 Q 250 402 260 412 Q 250 422 240 412 Z" fill="#184e36" />
  <path d="M 225 412 Q 235 406 245 412 Z" fill="#184e36" />
  <path d="M 255 412 Q 265 406 275 412 Z" fill="#184e36" />
  <line x1="150" y1="412" x2="220" y2="412" stroke="#184e36" stroke-width="2" />
  <line x1="280" y1="412" x2="350" y2="412" stroke="#184e36" stroke-width="2" />

  <!-- Tagline Text -->
  <text x="250" y="440" text-anchor="middle" class="tagline-text">FASHION THAT LIVES</text>
  <text x="250" y="462" text-anchor="middle" class="tagline-text">MORE THAN ONE LIFE</text>
</svg>
